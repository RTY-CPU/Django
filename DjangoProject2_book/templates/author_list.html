{% extends 'home.html' %}


{% block content %}

    <h1 class="text-center">作者列表</h1>
    <a href="{% url 'author_add' %}" class="btn btn-success pull-left">添加作者</a>

    <table class="table table-hover table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>年龄</th>
                <th>联系方式</th>
                <th>地址</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            {% for author in author_list %}
                <tr>
                    <td>{{ author.pk }}</td>
                    <td>{{ author.name }}</td>
                    <td>{{ author.age }}</td>
                    <td>{{ author.authordetail.phone }}</td>
                     <td>{{ author.authordetail.addr  }}</td>
                    <td>
                        <a href="{% url 'author_edit' author_id=author.pk %}">编辑</a>
                        <a href="{% url 'author_delete' delete_id=author.pk %}">删除</a>
                    </td>
                </tr>
            {% endfor %}

                
                
                

            

        </tbody>

    </table>


{% endblock %}
